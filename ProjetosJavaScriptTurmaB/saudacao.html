<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Function</title>
</head>

<body>
    <h1>Arrow Function</h1>
    <p>Veja como é simples usar uma arrow function (função e seta)</p>
    <p>Clique nos botões abaixo:</p>
    <input id="texto" type="text">
    <input type="button" name="input-hello" id="input-hello" onclick="saudacaoFunc()" value="Comprimentar" />

    <script>
        let saudacao = document.getElementById('texto')

        saudacaoFunc = () => {
            alert(`Bom dia, ${saudacao.value}`);
        }
    </script>
</body>

</html>
